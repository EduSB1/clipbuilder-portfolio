# Cabeçalhos e timeouts do proxy para o backend, comuns a todas as rotas /api.
# Incluído pelas locations de nginx-app.conf.
proxy_http_version 1.1;
proxy_set_header   Host              $host;
proxy_set_header   X-Real-IP         $remote_addr;
proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header   X-Forwarded-Proto $scheme;

# Exportação de PDF via LibreOffice e transcrição de vídeos longos podem
# ultrapassar os 120s anteriores.
proxy_connect_timeout 15s;
proxy_read_timeout    300s;
proxy_send_timeout    300s;
client_body_timeout   300s;
