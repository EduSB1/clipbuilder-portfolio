# ─── Aplicação (comum a produção e desenvolvimento) ──────────────────────────
# Incluído dentro de um bloco `server` por nginx.conf (HTTPS com domínio) e por
# nginx.dev.conf (HTTP em localhost). Tudo o que não depende de domínio nem de
# certificado fica aqui, para as duas configurações não divergirem.

# ─── Compressão ───────────────────────────────────────────────────────────────
gzip              on;
gzip_vary         on;
gzip_comp_level   6;
gzip_min_length   1024;
gzip_proxied      any;
gzip_types
  text/plain
  text/css
  text/javascript
  application/javascript
  application/json
  application/manifest+json
  application/xml
  image/svg+xml;

include /etc/nginx/security-headers.conf;

root  /usr/share/nginx/html;
index index.html;

# SPA fallback
location / {
  try_files $uri $uri/ /index.html;
}

# Bloqueia acesso ao /src/ (garante que o build de produção foi servido,
# e não o código-fonte de desenvolvimento)
location ^~ /src/ {
  return 404;
}

# index.html sem cache — é o ponteiro para os assets versionados
location = /index.html {
  include /etc/nginx/security-headers.conf;
  add_header Cache-Control "no-cache, no-store, must-revalidate";
  add_header Pragma        "no-cache";
  add_header Expires       "0";
}

# Assets com hash no nome → cache longo e imutável
location /assets/ {
  include /etc/nginx/security-headers.conf;
  expires 1y;
  add_header Cache-Control "public, immutable";
  try_files $uri =404;
}

# Proxy para o backend.
# O corpo é limitado a 128 MB: as rotas JSON leem o corpo inteiro na memória,
# e o maior arquivo legítimo fora dos vídeos é o GIF (até 100 MB).
location /api/ {
  rewrite ^/api/(.*)$ /$1 break;
  proxy_pass http://backend:8000;
  include /etc/nginx/proxy.conf;
  client_max_body_size 128m;
}

# Upload de vídeo: as duas únicas rotas que recebem arquivos grandes, em
# streaming direto para o disco do backend.
location = /api/videos/raw {
  proxy_pass http://backend:8000/videos/raw$is_args$args;
  include /etc/nginx/proxy.conf;
  client_max_body_size    6g;
  proxy_request_buffering off;
}

location = /api/videos {
  proxy_pass http://backend:8000/videos$is_args$args;
  include /etc/nginx/proxy.conf;
  client_max_body_size    6g;
  proxy_request_buffering off;
}
