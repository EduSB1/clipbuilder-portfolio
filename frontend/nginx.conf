# ─── Compressão ───────────────────────────────────────────────────────────────
gzip              on;
gzip_vary         on;
gzip_comp_level   6;
gzip_min_length   1024;
gzip_proxied      any;
gzip_types
  text/plain
  text/css
  text/javascript
  application/javascript
  application/json
  application/manifest+json
  application/xml
  image/svg+xml;

# Não anuncia a versão do nginx nas respostas e páginas de erro.
server_tokens off;

# ─── HTTP → HTTPS redirect + ACME challenge ───────────────────────────────────
server {
  listen 80;
  server_name clipbuilder.com.br www.clipbuilder.com.br;

  # Let's Encrypt webroot challenge
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Redireciona todo o resto para HTTPS
  location / {
    return 301 https://$host$request_uri;
  }
}

# ─── HTTPS ─────────────────────────────────────────────────────────────────────
server {
  listen 443 ssl;
  http2 on;
  server_name clipbuilder.com.br www.clipbuilder.com.br;

  # Certificados Let's Encrypt
  ssl_certificate     /etc/letsencrypt/live/clipbuilder.com.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/clipbuilder.com.br/privkey.pem;

  # Configurações SSL modernas
  ssl_protocols             TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache         shared:SSL:10m;
  ssl_session_timeout       1d;
  ssl_session_tickets       off;

  include /etc/nginx/security-headers.conf;

  root  /usr/share/nginx/html;
  index index.html;

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Bloqueia acesso ao /src/ (garante que o build de produção foi servido,
  # e não o código-fonte de desenvolvimento)
  location ^~ /src/ {
    return 404;
  }

  # index.html sem cache — é o ponteiro para os assets versionados
  location = /index.html {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma        "no-cache";
    add_header Expires       "0";
  }

  # Assets com hash no nome → cache longo e imutável
  location /assets/ {
    include /etc/nginx/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Proxy para o backend
  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass         http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # Exportação de PDF via LibreOffice e transcrição de vídeos longos podem
    # ultrapassar os 120s anteriores.
    proxy_connect_timeout 15s;
    proxy_read_timeout    300s;
    proxy_send_timeout    300s;

    # Uploads de vídeo chegam por aqui.
    client_max_body_size    6g;
    client_body_timeout     300s;
    proxy_request_buffering off;
  }
}
