# Produção: HTTPS com certificado Let's Encrypt para o domínio público.
# As rotas da aplicação ficam em nginx-app.conf.

# Não anuncia a versão do nginx nas respostas e páginas de erro.
server_tokens off;

# ─── HTTP → HTTPS redirect + ACME challenge ───────────────────────────────────
server {
  listen 80;
  server_name clipbuilder.com.br www.clipbuilder.com.br;

  # Let's Encrypt webroot challenge
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Redireciona todo o resto para HTTPS
  location / {
    return 301 https://$host$request_uri;
  }
}

# ─── HTTPS ─────────────────────────────────────────────────────────────────────
server {
  listen 443 ssl;
  http2 on;
  server_name clipbuilder.com.br www.clipbuilder.com.br;

  # Certificados Let's Encrypt
  ssl_certificate     /etc/letsencrypt/live/clipbuilder.com.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/clipbuilder.com.br/privkey.pem;

  # Configurações SSL modernas
  ssl_protocols             TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache         shared:SSL:10m;
  ssl_session_timeout       1d;
  ssl_session_tickets       off;

  include /etc/nginx/app.conf;
}
