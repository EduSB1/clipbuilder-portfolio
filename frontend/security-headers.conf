# ─── Headers de segurança ─────────────────────────────────────────────────────
# Este arquivo é incluído em TODO bloco `location` que declara seus próprios
# `add_header`. Isso é necessário porque no nginx um `add_header` dentro de um
# location SUBSTITUI (não acumula com) os headers herdados do bloco `server`.
# Sem esse include, as rotas com cache próprio ficariam sem HSTS/nosniff/etc.

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Frame-Options           "SAMEORIGIN"                                    always;
add_header X-Content-Type-Options    "nosniff"                                       always;
add_header Referrer-Policy           "strict-origin-when-cross-origin"               always;
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=(self)" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups"                     always;

# ─── Content-Security-Policy ──────────────────────────────────────────────────
# Publicada em modo Report-Only: o navegador reporta violações no console mas
# não bloqueia nada. Acompanhe o console por alguns dias com todos os fluxos
# (login Clerk, Turnstile, checkout Mercado Pago, editor de imagem) e, quando
# não houver mais violações, troque o nome do header para
# `Content-Security-Policy` para passar a bloquear de fato.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://*.clerk.accounts.dev https://clerk.clipbuilder.com.br https://challenges.cloudflare.com https://sdk.mercadopago.com https://*.mercadopago.com https://*.mlstatic.com blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' https://*.clerk.accounts.dev https://clerk.clipbuilder.com.br https://api.clerk.com https://api.mercadopago.com https://*.mercadopago.com; frame-src https://challenges.cloudflare.com https://*.clerk.accounts.dev https://*.mercadopago.com https://www.youtube.com https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
